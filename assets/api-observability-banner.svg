<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="400">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <style>
      .pulse-circle { animation: pulse 3s ease-in-out infinite; }
      .telemetry-line { stroke-dasharray: 8 12; animation: dash 20s linear infinite; }
      .wave { animation: float 6s ease-in-out infinite; }
      @keyframes dash {
        to { stroke-dashoffset: -1000; }
      }
      @keyframes pulse {
        0%, 100% { opacity: 0.3; r: 4px; }
        50% { opacity: 1; r: 7px; filter: drop-shadow(0 0 8px #38bdf8); }
      }
      @keyframes float {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-8px); }
      }
      .title-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 800; }
      .sub-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 400; }
    </style>
  </defs>

  <rect width="1200" height="400" fill="url(#bgGrad)" rx="16" />
  
  <g opacity="0.12" stroke="#94a3b8" stroke-width="1">
    <line x1="0" y1="80" x2="1200" y2="80" />
    <line x1="0" y1="160" x2="1200" y2="160" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="0" y1="320" x2="1200" y2="320" />
    <line x1="200" y1="0" x2="200" y2="400" />
    <line x1="400" y1="0" x2="400" y2="400" />
    <line x1="600" y1="0" x2="600" y2="400" />
    <line x1="800" y1="0" x2="800" y2="400" />
    <line x1="1000" y1="0" x2="1000" y2="400" />
  </g>

  <circle cx="150" cy="100" r="120" fill="url(#glowGrad)" />
  <circle cx="1050" cy="300" r="140" fill="url(#glowGrad)" />

  <g class="wave">
    <path class="telemetry-line" d="M 100 280 Q 250 200 400 290 T 700 240 T 1000 270 T 1150 210" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.6" />
    <path class="telemetry-line" d="M 80 320 Q 300 370 550 310 T 850 330 T 1120 280" fill="none" stroke="#c084fc" stroke-width="1.5" opacity="0.5" style="animation-duration: 15s; stroke-dasharray: 6 10;" />
  </g>

  <circle cx="250" cy="240" r="5" fill="#38bdf8" class="pulse-circle" style="animation-delay: 0s;" />
  <circle cx="400" cy="290" r="5" fill="#818cf8" class="pulse-circle" style="animation-delay: 0.8s;" />
  <circle cx="700" cy="240" r="5" fill="#c084fc" class="pulse-circle" style="animation-delay: 1.6s;" />
  <circle cx="1000" cy="270" r="5" fill="#34d399" class="pulse-circle" style="animation-delay: 2.4s;" />

  <g transform="translate(120, 150)" filter="url(#glow)">
    <circle cx="0" cy="0" r="42" fill="none" stroke="url(#accentGrad)" stroke-width="3" opacity="0.8" />
    <circle cx="0" cy="0" r="26" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="4 6" opacity="0.7" />
    <circle cx="0" cy="0" r="6" fill="#38bdf8" />
    <line x1="0" y1="0" x2="28" y2="-28" stroke="#c084fc" stroke-width="2.5" stroke-linecap="round">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="4s" repeatCount="indefinite" />
    </line>
  </g>

  <text x="210" y="150" class="title-text" font-size="48" fill="url(#accentGrad)" letter-spacing="-0.5">
    Awesome API Observability 👁️⚡
  </text>

  <text x="212" y="190" class="sub-text" font-size="20" fill="#94a3b8" letter-spacing="0.5">
    Distributed Tracing • Telemetry • Metrics • Logs • Gateways • eBPF • Real-Time Analytics
  </text>

  <g transform="translate(212, 230)">
    <rect x="0" y="0" width="150" height="34" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2" opacity="0.9" />
    <circle cx="18" cy="17" r="4" fill="#38bdf8" />
    <text x="32" y="22" class="sub-text" font-size="13" font-weight="600" fill="#f1f5f9">OpenTelemetry</text>

    <rect x="165" y="0" width="145" height="34" rx="8" fill="#1e293b" stroke="#818cf8" stroke-width="1.2" opacity="0.9" />
    <circle cx="183" cy="17" r="4" fill="#818cf8" />
    <text x="197" y="22" class="sub-text" font-size="13" font-weight="600" fill="#f1f5f9">Golden Signals</text>

    <rect x="325" y="0" width="155" height="34" rx="8" fill="#1e293b" stroke="#c084fc" stroke-width="1.2" opacity="0.9" />
    <circle cx="343" cy="17" r="4" fill="#c084fc" />
    <text x="357" y="22" class="sub-text" font-size="13" font-weight="600" fill="#f1f5f9">ClickHouse &amp; OTel</text>

    <rect x="495" y="0" width="170" height="34" rx="8" fill="#1e293b" stroke="#34d399" stroke-width="1.2" opacity="0.9" />
    <circle cx="513" cy="17" r="4" fill="#34d399" />
    <text x="527" y="22" class="sub-text" font-size="13" font-weight="600" fill="#f1f5f9">API Gateway Telemetry</text>
  </g>
</svg>